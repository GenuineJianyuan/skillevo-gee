[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillevo-gee"
version = "0.1.0"
description = "Skill-driven, evolvable geospatial analysis workflows for Google Earth Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
skillevo-gee = "cli:main"

[tool.setuptools]
py-modules = ["cli", "evolution", "hermes_runner", "models", "paths", "workflow"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gee*", "knowledge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

